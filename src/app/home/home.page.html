<ion-content [fullscreen]="true">
        
        <table border="1">
               <tr>
                <td>
                        <ng-container *ngFor="let produto of this.produtos">
                                <td>{{ produto.nome }}</td>
                                <td>{{ produto.validade }}</td>
                                <td>{{ produto.lote }}</td>
                        </ng-container>
                </td>
               </tr>
        </table>

</ion-content>>
